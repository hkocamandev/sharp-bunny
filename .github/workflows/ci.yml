name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No token permissions by default; each job only reads the code.
permissions: {}

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dependency vulnerability scan (production)
        run: npm audit --omit=dev --audit-level=high
      - name: Syntax check
        run: for f in producer.js worker.js worker-watermark.js; do node --check "$f"; done
      # No RabbitMQ needed: the tests drive sharp and multer the way the
      # producer and workers do.
      - run: npm test
