version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Version-update PRs for minor and patch releases only; major upgrades
    # need code changes and are done deliberately. Security updates are not
    # affected by this rule and still arrive for any version.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # Version-update PRs for minor and patch releases only; major upgrades
    # need code changes and are done deliberately. Security updates are not
    # affected by this rule and still arrive for any version.
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
